<script>
(function(){
"use strict";

/* ============================ data ============================ */
const RAW = JSON.parse(document.getElementById('graphdata').textContent);
const THEME = {
  A:{c:'#E9B44C', name:'Unity & diversity'},
  B:{c:'#57A9DC', name:'Form & function'},
  C:{c:'#4FBE8F', name:'Interaction & interdependence'},
  D:{c:'#E8608C', name:'Continuity & change'}
};
const KINDLABEL = {makes:'makes / becomes', needs:'needs / depends on', part:'is part of', controls:'controls', evidence:'is evidence for'};
const DASH = {makes:[], needs:[6,4], controls:[1.6,4], part:[], evidence:[11,4,2,4]};
const WIDTH = {makes:1.4, needs:1.4, controls:1.4, part:0.9, evidence:1.4};

const nodes = RAW.nodes.map(n=>({...n, x:0,y:0,vx:0,vy:0, deg:0, out:[], inc:[]}));
const byId = new Map(nodes.map(n=>[n.id,n]));
const links = RAW.links.map(l=>({...l, a:byId.get(l.s), b:byId.get(l.t)}));
links.forEach(l=>{ l.a.deg++; l.b.deg++; l.a.out.push(l); l.b.inc.push(l); });
const adj = new Map(nodes.map(n=>[n.id,[]]));
links.forEach(l=>{ adj.get(l.s).push([l.t,l]); adj.get(l.t).push([l.s,l]); });
nodes.forEach(n=> n.r = 4.4 + Math.sqrt(n.deg)*2.2 );

/* ======================= layout simulation ==================== */
const ANCH = {A:[-560,-360], B:[560,-360], C:[560,360], D:[-560,360]};
nodes.forEach((n,i)=>{
  const a = ANCH[n.theme], ang = i*2.399;
  n.x = a[0] + Math.cos(ang)*Math.sqrt(i)*22;
  n.y = a[1] + Math.sin(ang)*Math.sqrt(i)*22;
});
let alpha = 1;
function tick(){
  if(alpha < 0.004) return false;
  alpha *= 0.994;
  const N = nodes.length;
  for(let i=0;i<N;i++){
    const a = nodes[i];
    for(let j=i+1;j<N;j++){
      const b = nodes[j];
      let dx = b.x-a.x, dy = b.y-a.y;
      let d2 = dx*dx+dy*dy;
      if(d2 > 62500 || d2 === 0) continue;
      if(d2 < 25) d2 = 25;
      const f = 4200/d2, d = Math.sqrt(d2);
      let fx = dx/d*f, fy = dy/d*f;
      // hard collision: circles must not sit on top of each other
      const min = a.r + b.r + 9;
      if(d < min){ const push = (min-d)*0.5; fx += dx/d*push; fy += dy/d*push; }
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  for(const l of links){
    const a=l.a, b=l.b;
    let dx=b.x-a.x, dy=b.y-a.y;
    const d = Math.hypot(dx,dy)||1;
    const rest = 96 + (a.theme===b.theme?0:40);
    const f = (d-rest)*0.026;
    const fx = dx/d*f, fy = dy/d*f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  for(const n of nodes){
    const a = ANCH[n.theme];
    n.vx += (a[0]-n.x)*0.0022 - n.x*0.0006;
    n.vy += (a[1]-n.y)*0.0022 - n.y*0.0006;
    if(n.fixed){ n.vx=0; n.vy=0; continue; }
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx*alpha*2.2; n.y += n.vy*alpha*2.2;
  }
  return true;
}
for(let i=0;i<700;i++) tick();

/* ============================ view ============================ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let vw=0, vh=0, dpr=1;
let tx=0, ty=0, k=1;
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio||1, 2);
  vw = r.width; vh = r.height;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  draw();
}
function fit(pad){
  pad = pad||70;
  const vis = nodes.filter(visible);
  const list = vis.length?vis:nodes;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of list){ x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); }
  k = Math.min((vw-pad*2)/(x1-x0||1), (vh-pad*2)/(y1-y0||1));
  k = Math.max(0.16, Math.min(k, 1.5));
  tx = vw/2 - (x0+x1)/2*k; ty = vh/2 - (y0+y1)/2*k;
  draw();
}
function toScreen(n){ return [n.x*k+tx, n.y*k+ty]; }
function toWorld(px,py){ return [(px-tx)/k, (py-ty)/k]; }

/* ========================= app state ========================== */
let sel = null;            // selected node id
let hover = null;          // hovered node id
let mode = 'explore';      // 'explore' | 'trace'
let traceA = null, traceB = null, tracePath = null, traceEdges = new Set();
const off = new Set();     // hidden themes
let pulse = 0;

function visible(n){ return !off.has(n.theme); }
function nbrs(id){ const s = new Set([id]); for(const [o] of adj.get(id)) s.add(o); return s; }

/* =========================== drawing ========================== */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,vw,vh);
  ctx.save();
  ctx.translate(tx,ty); ctx.scale(k,k);

  const focus = hover || sel;
  const near = focus ? nbrs(focus) : null;
  const onPath = tracePath ? new Set(tracePath) : null;

  // --- edges ---
  for(const l of links){
    const a=l.a, b=l.b;
    if(!visible(a) || !visible(b)) continue;
    const inTrace = traceEdges.has(l);
    const inFocus = near && (near.has(a.id) && near.has(b.id)) && (a.id===focus || b.id===focus);
    let alphaE, col, w;
    if(inTrace){ alphaE=1; col='#C0A2FF'; w=2.4; }
    else if(inFocus){ alphaE=0.85; col= a.id===focus ? THEME[b.theme].c : THEME[a.theme].c; w=WIDTH[l.k]+0.7; }
    else if(focus || onPath){ alphaE=0.055; col='#8878A8'; w=WIDTH[l.k]; }
    else { alphaE=0.19; col='#8878A8'; w=WIDTH[l.k]; }
    ctx.globalAlpha = alphaE;
    ctx.strokeStyle = col; ctx.lineWidth = w/k;
    ctx.setLineDash(DASH[l.k].map(v=>v/k));
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.setLineDash([]);
    if((inTrace || inFocus) && k>0.35) arrow(a,b,col,alphaE);
    if(inTrace){
      // travelling pulse
      const t = (pulse + (l.i||0)*0.13) % 1;
      const px = a.x + (b.x-a.x)*t, py = a.y + (b.y-a.y)*t;
      ctx.globalAlpha = 0.95; ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(px,py,2.4/k,0,7); ctx.fill();
    }
  }

  // --- nodes ---
  for(const n of nodes){
    if(!visible(n)) continue;
    const isSel = n.id===sel, isNear = near && near.has(n.id), inP = onPath && onPath.has(n.id);
    const isEnd = n.id===traceA || n.id===traceB;
    let a = 1;
    if(tracePath){ a = inP ? 1 : 0.13; }
    else if(focus){ a = isNear ? 1 : 0.15; }
    const col = THEME[n.theme].c;
    ctx.globalAlpha = a;

    if(isSel || isEnd || (inP && tracePath)){
      ctx.globalAlpha = a*0.22; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+9/k,0,7); ctx.fill();
      ctx.globalAlpha = a;
    }
    const rr = (inP ? n.r*1.35 : n.r);
    // cytoplasm
    ctx.fillStyle = col;
    ctx.globalAlpha = a*0.30;
    ctx.beginPath(); ctx.arc(n.x,n.y,rr,0,7); ctx.fill();
    // wall
    ctx.globalAlpha = a;
    ctx.strokeStyle = col; ctx.lineWidth = (isSel||isEnd||inP?2.1:1.25)/k;
    ctx.beginPath(); ctx.arc(n.x,n.y,rr,0,7); ctx.stroke();
    // nucleus
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(1.1,rr*0.34),0,7); ctx.fill();
  }

  // --- labels: placed greedily by importance, skipping any that would collide ---
  ctx.textAlign='center'; ctx.textBaseline='top';
  const showAll = k > 0.62;
  const cand = [];
  for(const n of nodes){
    if(!visible(n)) continue;
    const isSel=n.id===sel, isNear = near&&near.has(n.id), inP = onPath&&onPath.has(n.id);
    if(tracePath && !inP) continue;
    if(!(showAll || n.deg>=8 || isSel || isNear || inP)) continue;
    const big = isSel || inP || n.id===focus;
    let pri = n.deg;
    if(isNear) pri += 500;
    if(inP) pri += 2000;
    if(big) pri += 4000;
    let a = 1;
    if(tracePath) a = 1;
    else if(focus) a = isNear?1:0.18;
    else a = showAll?0.78:0.6;
    cand.push({n, big, pri, a});
  }
  cand.sort((p,q)=> q.pri-p.pri);
  const boxes = [];
  const fits = (x,y,w,h)=>{
    for(let i=0;i<boxes.length;i++){
      const b = boxes[i];
      if(x < b.x+b.w && x+w > b.x && y < b.y+b.h && y+h > b.y) return false;
    }
    return true;
  };
  for(const c of cand){
    const n = c.n;
    const fs = (c.big?12.5:11)/k;
    ctx.font = (c.big?'600 ':'400 ')+fs+'px "Public Sans",system-ui,sans-serif';
    const w = ctx.measureText(n.label).width + 6/k;
    const h = fs*1.3;
    const x = n.x - w/2, y = n.y + n.r + 3.5/k;
    if(!c.big && !fits(x,y,w,h)) continue;   // important labels always win their space
    boxes.push({x,y,w,h});
    ctx.globalAlpha = c.a*0.72;
    ctx.fillStyle = '#0E0B14';
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.big ? '#FFFFFF' : '#C6BAD8';
    ctx.fillText(n.label, n.x, y+1/k);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
function arrow(a,b,col,al){
  const ang = Math.atan2(b.y-a.y,b.x-a.x);
  const ex = b.x - Math.cos(ang)*(b.r+1.5/k), ey = b.y - Math.sin(ang)*(b.r+1.5/k);
  const s = 6/k;
  ctx.globalAlpha = al; ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-Math.cos(ang-0.42)*s, ey-Math.sin(ang-0.42)*s);
  ctx.lineTo(ex-Math.cos(ang+0.42)*s, ey-Math.sin(ang+0.42)*s);
  ctx.closePath(); ctx.fill();
}

/* animation loop: only runs when something needs it */
let raf=null, settling=false;
function loop(){
  let more = false;
  if(settling){ more = tick(); if(!more) settling=false; }
  if(traceEdges.size){ pulse = (pulse+0.006)%1; more = true; }
  draw();
  raf = more ? requestAnimationFrame(loop) : null;
}
function kick(){ if(!raf) raf = requestAnimationFrame(loop); }
function reheat(v){ alpha = Math.max(alpha, v||0.35); settling=true; kick(); }

/* ========================== interaction ======================= */
let drag=null, panning=null, moved=false;
function hit(px,py){
  const [wx,wy] = toWorld(px,py);
  let best=null, bd=1e9;
  for(const n of nodes){
    if(!visible(n)) continue;
    const d = Math.hypot(n.x-wx, n.y-wy);
    if(d < n.r + 9/k && d < bd){ bd=d; best=n; }
  }
  return best;
}
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  moved=false;
  const r = cv.getBoundingClientRect();
  const n = hit(e.clientX-r.left, e.clientY-r.top);
  if(n){ drag = {n, ox:0, oy:0}; n.fixed=true; }
  else { panning = {x:e.clientX-tx, y:e.clientY-ty}; cv.classList.add('grabbing'); }
});
cv.addEventListener('pointermove', e=>{
  const r = cv.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  if(drag){
    moved=true;
    const [wx,wy] = toWorld(px,py);
    drag.n.x=wx; drag.n.y=wy; reheat(0.16); return;
  }
  if(panning){ moved=true; tx = e.clientX-panning.x; ty = e.clientY-panning.y; draw(); return; }
  const n = hit(px,py);
  cv.classList.toggle('pointing', !!n);
  const id = n?n.id:null;
  if(id!==hover){ hover=id; draw(); }
  showTip(n, e.clientX, e.clientY);
});
function endPointer(e){
  const r = cv.getBoundingClientRect();
  if(drag){
    drag.n.fixed=false;
    if(!moved) select(drag.n.id);
    drag=null;
  } else if(panning){
    if(!moved && mode==='explore'){ /* click empty space */ select(null); }
    panning=null; cv.classList.remove('grabbing');
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', ()=>{ hover=null; hideTip(); draw(); });
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  const [wx,wy] = toWorld(px,py);
  const f = Math.exp(-e.deltaY*0.0016);
  k = Math.max(0.12, Math.min(3.2, k*f));
  tx = px - wx*k; ty = py - wy*k;
  draw();
},{passive:false});

const tipEl = document.getElementById('tip');
function showTip(n,cx,cy){
  if(!n){ hideTip(); return; }
  tipEl.innerHTML = '<div class="t" style="color:'+THEME[n.theme].c+'">'+esc(n.label)+'</div>'+
    '<div class="b">'+esc(n.def.slice(0,120))+(n.def.length>120?'…':'')+'<br><em>'+n.deg+' link'+(n.deg===1?'':'s')+'</em></div>';
  tipEl.classList.add('on');
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(cx+16, window.innerWidth-w-10)+'px';
  tipEl.style.top = Math.max(8, Math.min(cy+16, window.innerHeight-h-10))+'px';
}
function hideTip(){ tipEl.classList.remove('on'); }

/* zoom buttons */
function zoomBy(f){
  const px=vw/2, py=vh/2, [wx,wy]=toWorld(px,py);
  k = Math.max(0.12, Math.min(3.2, k*f));
  tx = px-wx*k; ty = py-wy*k; draw();
}
document.getElementById('zin').onclick = ()=>zoomBy(1.3);
document.getElementById('zout').onclick = ()=>zoomBy(1/1.3);
document.getElementById('zfit').onclick = ()=>{ fit(); };
document.getElementById('keyt').onclick = ()=>{
  const el = document.getElementById('key');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
};

/* ========================== selection ========================= */
function select(id, keepView){
  if(mode==='trace' && id){
    if(!traceA){ traceA=id; }
    else if(!traceB && id!==traceA){ traceB=id; computePath(); }
    else { traceA=id; traceB=null; tracePath=null; traceEdges.clear(); }
    renderTrace(); draw(); kick(); return;
  }
  sel = id;
  renderPanel();
  if(id && !keepView) centerOn(byId.get(id));
  draw();
}
function centerOn(n){
  const target = Math.max(k, 0.72);
  const sx = vw/2, sy = vh/2;
  const k0=k, tx0=tx, ty0=ty;
  const k1=target, tx1 = sx - n.x*target, ty1 = sy - n.y*target;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ k=k1; tx=tx1; ty=ty1; draw(); return; }
  const t0 = performance.now();
  (function anim(){
    const p = Math.min(1,(performance.now()-t0)/420);
    const e = 1-Math.pow(1-p,3);
    k = k0+(k1-k0)*e; tx = tx0+(tx1-tx0)*e; ty = ty0+(ty1-ty0)*e;
    draw();
    if(p<1) requestAnimationFrame(anim);
  })();
}

/* ============================ panel =========================== */
const panel = document.getElementById('panel');
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function intro(){
  const counts = {A:0,B:0,C:0,D:0};
  nodes.forEach(n=>counts[n.theme]++);
  return '<div class="empty">'+
   '<h2>Nothing in biology stands on its own.</h2>'+
   '<p class="lead">This is every idea in your notes, drawn as one system. Each circle is a concept. Each line is a stated relationship — not decoration, but a claim you could write in an exam.</p>'+
   '<div class="stat">'+
     '<div><span>'+nodes.length+'</span><small>concepts</small></div>'+
     '<div><span>'+links.length+'</span><small>links</small></div>'+
     '<div><span>4</span><small>themes</small></div>'+
   '</div>'+
   '<ul>'+
     '<li><span class="n">01</span><b>Click any circle</b> to read what it is and every concept it touches, with the relationship spelled out.</li>'+
     '<li><span class="n">02</span><b>Trace a path</b> between two ideas and the web writes the chain of reasoning connecting them. Try glucose to thermoregulation.</li>'+
     '<li><span class="n">03</span><b>Filter by theme</b> using the four chips above, or search by name.</li>'+
     '<li><span class="n">04</span><b>Drag, scroll and pan</b> the web itself. Nodes grow with the number of links they carry, so the busiest ideas are the biggest.</li>'+
   '</ul>'+
   '<p style="margin-top:20px;color:var(--faint);font-size:12.5px">The four clusters are the four syllabus themes. Where they touch is where the interesting questions live.</p>'+
   '</div>';
}

function sentence(l, fromId){
  const a=l.a, b=l.b;
  const meIsA = a.id===fromId;
  const A = '<b style="color:'+THEME[a.theme].c+'">'+esc(a.label)+'</b>';
  const B = '<b style="color:'+THEME[b.theme].c+'">'+esc(b.label)+'</b>';
  const Am = meIsA ? '<b class="me">'+esc(a.label)+'</b>' : A;
  const Bm = !meIsA ? '<b class="me">'+esc(b.label)+'</b>' : B;
  return Am+' '+esc(l.r)+' '+Bm;
}

function renderPanel(){
  if(!sel){ panel.innerHTML = intro(); return; }
  const n = byId.get(sel);
  const col = THEME[n.theme].c;
  const outs = n.out.slice().sort((x,y)=> y.b.deg-x.b.deg);
  const incs = n.inc.slice().sort((x,y)=> y.a.deg-x.a.deg);
  let h = '';
  h += '<div class="crumb">'+
        '<span class="code">'+esc(n.code)+'</span>'+
        (n.hl?'<span class="hl" style="color:'+col+'">HL</span>':'')+
        '<span class="themetag" style="color:'+col+'">'+esc(THEME[n.theme].name)+'</span>'+
        '<button class="back" id="clearsel">clear ✕</button>'+
       '</div>';
  h += '<h2 class="title">'+esc(n.label)+'</h2>';
  h += '<p class="def">'+esc(n.def)+'</p>';

  if(outs.length){
    h += '<div class="secthead"><h3>What it leads to</h3><span>'+outs.length+'</span></div>';
    for(const l of outs) h += linkRow(l, n.id, l.t);
  }
  if(incs.length){
    h += '<div class="secthead"><h3>What leads to it</h3><span>'+incs.length+'</span></div>';
    for(const l of incs) h += linkRow(l, n.id, l.s);
  }
  h += '<div class="secthead"><h3>Trace from here</h3><span></span></div>'+
       '<button class="link" id="startTrace"><span class="kind">path finder</span>'+
       '<span class="sent">Use <b style="color:var(--violet)">'+esc(n.label)+'</b> as the starting point and pick a destination.</span></button>';
  panel.innerHTML = h;
  panel.parentElement.querySelector('.pscroll').scrollTop = 0;
  panel.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=> select(b.dataset.go));
  panel.querySelectorAll('[data-go]').forEach(b=>{
    b.onmouseenter = ()=>{ hover = b.dataset.go; draw(); };
    b.onmouseleave = ()=>{ hover = null; draw(); };
  });
  const cs = document.getElementById('clearsel'); if(cs) cs.onclick = ()=>select(null);
  const st = document.getElementById('startTrace');
  if(st) st.onclick = ()=>{ setMode('trace'); traceA = n.id; traceB=null; tracePath=null; traceEdges.clear(); renderTrace(); draw(); };
}
function linkRow(l, meId, otherId){
  return '<button class="link" data-go="'+otherId+'">'+
    '<span class="kind">'+KINDLABEL[l.k]+'</span>'+
    '<span class="sent">'+sentence(l, meId)+'</span></button>';
}

/* =========================== trace mode ======================= */
const tracebarEl = document.getElementById('tracebar');
const tracebtn = document.getElementById('tracebtn');
function setMode(m){
  mode = m;
  tracebtn.classList.toggle('on', m==='trace');
  tracebtn.textContent = m==='trace' ? 'Exit trace' : 'Trace a path';
  tracebarEl.style.display = m==='trace' ? 'block':'none';
  if(m==='trace'){ sel=null; renderTrace(); }
  else { traceA=traceB=null; tracePath=null; traceEdges.clear(); renderPanel(); }
  draw(); kick();
}
tracebtn.onclick = ()=> setMode(mode==='trace'?'explore':'trace');

function renderTrace(){
  const nameA = traceA?byId.get(traceA).label:'Pick a starting concept';
  const nameB = traceB?byId.get(traceB).label:(traceA?'Now pick a destination':'then a destination');
  tracebarEl.innerHTML =
    '<div class="tracebar"><h3>Path finder</h3>'+
    '<div class="slots">'+
      '<div class="slot '+(traceA?'filled':'active')+'">'+esc(nameA)+'</div>'+
      '<span class="arrow">→</span>'+
      '<div class="slot '+(traceB?'filled':(traceA?'active':''))+'">'+esc(nameB)+'</div>'+
    '</div>'+
    '<div class="tracebtns">'+
      '<button id="trreset">Clear</button>'+
      '<button id="trrand">Surprise me</button>'+
    '</div></div>';
  document.getElementById('trreset').onclick = ()=>{ traceA=traceB=null; tracePath=null; traceEdges.clear(); renderTrace(); tracePanel(); draw(); };
  document.getElementById('trrand').onclick = ()=>{
    const vis = nodes.filter(visible);
    if(vis.length<2) return;
    traceA = vis[Math.floor(Math.random()*vis.length)].id;
    do { traceB = vis[Math.floor(Math.random()*vis.length)].id; } while(traceB===traceA);
    computePath(); renderTrace(); draw(); kick();
  };
  tracePanel();
}
function computePath(){
  const prev = new Map(), seen = new Set([traceA]);
  let q=[traceA], found=false;
  while(q.length && !found){
    const nq=[];
    for(const cur of q){
      for(const [o,l] of adj.get(cur)){
        if(seen.has(o)) continue;
        if(!visible(byId.get(o))) continue;
        seen.add(o); prev.set(o,[cur,l]); 
        if(o===traceB){ found=true; break; }
        nq.push(o);
      }
      if(found) break;
    }
    q=nq;
  }
  traceEdges.clear();
  if(!found){ tracePath=null; tracePanel(); return; }
  const path=[traceB], edges=[];
  let cur=traceB;
  while(cur!==traceA){ const [p,l]=prev.get(cur); edges.unshift(l); path.unshift(p); cur=p; }
  tracePath = path; tracePathEdges = edges;
  edges.forEach((l,i)=>{ l.i=i; traceEdges.add(l); });
  tracePanel();
  fitPath();
}
let tracePathEdges = [];
function fitPath(){
  if(!tracePath) return;
  const list = tracePath.map(id=>byId.get(id));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of list){ x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y); }
  const pad=110;
  const k1 = Math.max(0.2, Math.min(1.4, Math.min((vw-pad*2)/(x1-x0||1),(vh-pad*2)/(y1-y0||1))));
  const tx1 = vw/2-(x0+x1)/2*k1, ty1 = vh/2-(y0+y1)/2*k1;
  const k0=k,tx0=tx,ty0=ty, t0=performance.now();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ k=k1;tx=tx1;ty=ty1;draw(); return; }
  (function anim(){
    const p=Math.min(1,(performance.now()-t0)/500), e=1-Math.pow(1-p,3);
    k=k0+(k1-k0)*e; tx=tx0+(tx1-tx0)*e; ty=ty0+(ty1-ty0)*e; draw();
    if(p<1) requestAnimationFrame(anim);
  })();
}
function tracePanel(){
  if(!traceA){
    panel.innerHTML = '<div class="empty"><h2>Two ideas, one chain of reasoning.</h2>'+
      '<p>Choose any two concepts. The web finds the shortest route between them and writes out every link along the way, in order.</p>'+
      '<p style="color:var(--faint);font-size:12.5px">Click a circle on the web, search by name, or press <b>Surprise me</b>.</p></div>';
    return;
  }
  if(!traceB){
    panel.innerHTML = '<div class="empty"><p class="lead">Starting at <b style="color:'+THEME[byId.get(traceA).theme].c+'">'+esc(byId.get(traceA).label)+'</b>.</p>'+
      '<p>Now pick a destination — the further away it looks, the more interesting the route.</p></div>';
    return;
  }
  if(!tracePath){
    panel.innerHTML = '<div class="empty"><p class="lead">No route with the current filters.</p><p>Some themes are switched off, which has cut the web in two. Turn them back on and try again.</p></div>';
    return;
  }
  let h = '<div class="crumb"><span class="code">'+(tracePath.length-1)+' step'+(tracePath.length===2?'':'s')+'</span>'+
          '<span class="themetag" style="color:var(--violet)">shortest route</span></div>';
  h += '<h2 class="title">'+esc(byId.get(traceA).label)+' <span style="color:var(--faint)">→</span> '+esc(byId.get(traceB).label)+'</h2>';

  // narrative: every clause is written in the direction its relationship was stated,
  // so it always reads as a true sentence. Consecutive forward hops chain with "which".
  let nar = '', chainSubject = null;
  const B = id => '<b>'+esc(byId.get(id).label)+'</b>';
  // ", which …" only reads correctly if the relationship opens with a finite verb
  // or a leading adverbial. Anything else starts a fresh sentence instead.
  const CHAINABLE = /^([a-z]+s|is|are|can|must|has|have|let|lets|only|when|if|in|after|before|during|such|given|that|repeated|by|of)\b/;
  for(let i=0;i<tracePathEdges.length;i++){
    const l = tracePathEdges[i], from = tracePath[i], to = tracePath[i+1];
    const fwd = l.s===from;
    const r = '<i>'+esc(l.r)+'</i>';
    if(fwd){
      if(chainSubject===from && CHAINABLE.test(l.r)) nar += ', which '+r+' '+B(to);
      else nar += (nar?'. ':'')+B(from)+' '+r+' '+B(to);
      chainSubject = to;
    } else {
      nar += (nar?'. ':'')+B(to)+' '+r+' '+B(from);
      chainSubject = null;
    }
  }
  h += '<div class="narrative">'+nar+'.</div>';

  for(let i=0;i<tracePath.length;i++){
    const n = byId.get(tracePath[i]);
    const col = THEME[n.theme].c;
    const last = i===tracePath.length-1;
    h += '<div class="step"><div class="rail">'+
         '<div class="bead" style="background:'+col+'"></div>'+
         (last?'':'<div class="stem"></div>')+
         '</div><div class="stepbody">'+
         '<button class="nm" data-go="'+n.id+'" style="color:'+col+'">'+esc(n.label)+'</button>';
    if(!last){
      const l = tracePathEdges[i];
      const fwd = l.s===tracePath[i];
      h += '<div class="via">'+(fwd?'':'<span class="rev">↰ read backwards &nbsp;</span>')+
           '<em>'+esc(KINDLABEL[l.k])+'</em> — '+sentence(l, fwd?n.id:tracePath[i+1])+'</div>';
    }
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{ setMode('explore'); select(b.dataset.go); });
}

/* =========================== filters ========================== */
const themesEl = document.getElementById('themes');
themesEl.innerHTML = Object.keys(THEME).map(t=>
  '<button class="chip on" data-t="'+t+'" style="color:'+THEME[t].c+'" title="'+THEME[t].name+'"><span class="sw"></span>'+t+'</button>'
).join('');
themesEl.querySelectorAll('.chip').forEach(b=>{
  b.onclick = ()=>{
    const t = b.dataset.t;
    if(off.has(t)){ off.delete(t); b.classList.add('on'); b.classList.remove('off'); }
    else { off.add(t); b.classList.remove('on'); b.classList.add('off'); }
    if(sel && off.has(byId.get(sel).theme)) select(null);
    if(tracePath) computePath();
    draw();
  };
});

/* =========================== search =========================== */
const q = document.getElementById('q'), res = document.getElementById('res');
let curIdx = -1, curList = [];
function runSearch(){
  const s = q.value.trim().toLowerCase();
  if(!s){ res.classList.remove('on'); curList=[]; return; }
  curList = nodes.filter(n=> visible(n) && (n.label.toLowerCase().includes(s) || n.code.toLowerCase().includes(s) || n.def.toLowerCase().includes(s)))
    .sort((a,b)=>{
      const ai = a.label.toLowerCase().indexOf(s), bi = b.label.toLowerCase().indexOf(s);
      const av = ai<0?99:ai, bv = bi<0?99:bi;
      return av-bv || b.deg-a.deg;
    }).slice(0,12);
  curIdx = 0;
  res.innerHTML = curList.length ? curList.map((n,i)=>
    '<button data-go="'+n.id+'" class="'+(i===0?'cur':'')+'">'+
    '<span class="dot" style="background:'+THEME[n.theme].c+'"></span>'+
    '<span class="nm">'+esc(n.label)+'</span><span class="cd">'+esc(n.code)+'</span></button>').join('')
    : '<div style="padding:10px;color:var(--faint);font-size:12.5px">No concept matches that.</div>';
  res.classList.add('on');
  res.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{ pick(b.dataset.go); });
}
function pick(id){
  q.value=''; res.classList.remove('on'); q.blur();
  select(id);
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ e.stopPropagation(); q.value=''; res.classList.remove('on'); q.blur(); return; }
  if(!curList.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    curIdx = (curIdx + (e.key==='ArrowDown'?1:-1) + curList.length)%curList.length;
    res.querySelectorAll('button').forEach((b,i)=> b.classList.toggle('cur', i===curIdx));
  }
  if(e.key==='Enter'){ e.preventDefault(); pick(curList[curIdx].id); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) res.classList.remove('on'); });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  if(e.key==='Escape'){ if(mode==='trace'){ setMode('explore'); } else select(null); }
});

/* =========================== toast ============================ */
const toastEl = document.getElementById('toast');
let toastT=null;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('on'), 2600);
}

/* =========================== boot ============================= */
window.addEventListener('resize', ()=>{ resize(); });
resize(); fit(); renderPanel();
setTimeout(()=>toast('Click any concept, or trace a path between two.'), 900);

})();
</script>
