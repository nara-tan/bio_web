<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Living Syllabus — IB Biology HL concept web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0B14;
  --ink2:#151020;
  --ink3:#1E1730;
  --line:#2C2340;
  --text:#EDE6F5;
  --mute:#9184A8;
  --faint:#6B5F82;
  --violet:#C0A2FF;
  --A:#E9B44C;
  --B:#57A9DC;
  --C:#4FBE8F;
  --D:#E8608C;
  --panelW:392px;
  --headH:64px;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.head{
  position:fixed;inset:0 0 auto 0;height:var(--headH);z-index:40;
  display:flex;align-items:center;gap:18px;padding:0 18px;
  background:linear-gradient(180deg,rgba(14,11,20,.96),rgba(14,11,20,.82));
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand h1{
  font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;margin:0;
  font-variation-settings:"opsz" 24;
}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}

.tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:nowrap}
.search{position:relative;width:250px}
.search input{
  width:100%;height:36px;padding:0 32px 0 12px;border-radius:9px;
  background:var(--ink3);border:1px solid var(--line);outline:none;font-size:13.5px;
}
.search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(192,162,255,.14)}
.search input::placeholder{color:var(--faint)}
.search kbd{
  position:absolute;right:9px;top:9px;font-family:var(--mono);font-size:10px;color:var(--faint);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;pointer-events:none;
}
.results{
  position:absolute;top:42px;left:0;right:0;max-height:340px;overflow:auto;z-index:60;
  background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:5px;
  box-shadow:0 22px 50px rgba(0,0,0,.6);display:none;
}
.results.on{display:block}
.results button{display:flex;width:100%;gap:9px;align-items:center;padding:7px 9px;border-radius:7px;text-align:left}
.results button:hover,.results button.cur{background:var(--ink3)}
.results .dot{width:7px;height:7px;border-radius:50%;flex:none}
.results .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .cd{font-family:var(--mono);font-size:10px;color:var(--faint)}

.themes{display:flex;gap:5px}
.chip{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;
  border:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--mute);transition:.15s;
}
.chip .sw{width:8px;height:8px;border-radius:2px;background:currentColor}
.chip.on{color:var(--text);background:var(--ink3)}
.chip.off{opacity:.34}
.chip:hover{border-color:var(--faint)}

.modebtn{
  height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--mute);transition:.15s;white-space:nowrap;
}
.modebtn:hover{color:var(--text);border-color:var(--faint)}
.modebtn.on{background:var(--violet);border-color:var(--violet);color:#14091F}

/* ---------- canvas ---------- */
#stage{position:fixed;inset:var(--headH) var(--panelW) 0 0;z-index:1}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.grabbing{cursor:grabbing}
canvas.pointing{cursor:pointer}

.tip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  max-width:300px;box-shadow:0 14px 34px rgba(0,0,0,.55);
}
.tip.on{opacity:1}
.tip .t{font-family:var(--display);font-weight:600;font-size:13.5px;margin-bottom:3px}
.tip .b{font-size:12px;color:var(--mute);line-height:1.45}
.tip em{font-style:normal;color:var(--violet)}

/* ---------- floating controls ---------- */
.hud{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.key{
  background:rgba(21,16,32,.9);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  backdrop-filter:blur(10px);width:214px;
}
.key h4{margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:500}
.key .row{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--mute);margin-bottom:5px}
.key .row:last-child{margin-bottom:0}
.key svg{flex:none}
.zoombar{display:flex;gap:5px}
.zoombar button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(21,16,32,.9);
  color:var(--mute);font-size:15px;display:grid;place-items:center;backdrop-filter:blur(10px);
}
.zoombar button:hover{color:var(--text);border-color:var(--faint)}
.zoombar button.wide{width:auto;padding:0 12px;font-size:12px;font-weight:600}
.keytoggle{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.keytoggle:hover{color:var(--text)}

/* ---------- panel ---------- */
.panel{
  position:fixed;top:var(--headH);right:0;bottom:0;width:var(--panelW);z-index:35;
  background:var(--ink2);border-left:1px solid var(--line);display:flex;flex-direction:column;
}
.pscroll{overflow-y:auto;padding:22px;flex:1}

.empty{padding:34px 24px;color:var(--mute)}
.empty h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.12;letter-spacing:-.025em;color:var(--text);margin:0 0 14px;font-variation-settings:"opsz" 40}
.empty p{font-size:13.5px;line-height:1.62;margin:0 0 13px}
.empty .lead{color:var(--text);font-size:14.5px}
.empty ul{margin:0;padding-left:0;list-style:none}
.empty li{font-size:13px;line-height:1.55;margin-bottom:11px;padding-left:26px;position:relative}
.empty li b{color:var(--text);font-weight:600}
.empty li .n{position:absolute;left:0;top:1px;font-family:var(--mono);font-size:10px;color:var(--violet)}
.stat{display:flex;gap:20px;margin:20px 0 22px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat div span{display:block;font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);line-height:1;font-variation-settings:"opsz" 30}
.stat div small{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--ink3);color:var(--mute)}
.hl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:5px;border:1px solid currentColor}
.themetag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.back{margin-left:auto;font-size:11.5px;color:var(--faint)}
.back:hover{color:var(--text)}

.panel h2.title{
  font-family:var(--display);font-weight:800;font-size:31px;line-height:1.06;letter-spacing:-.03em;
  margin:0 0 12px;font-variation-settings:"opsz" 44;
}
.def{font-size:14.5px;line-height:1.6;color:#CFC4DE;margin:0 0 22px}

.secthead{
  display:flex;align-items:baseline;gap:8px;margin:0 0 12px;padding-top:18px;border-top:1px solid var(--line);
}
.secthead h3{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0}
.secthead span{font-family:var(--mono);font-size:10px;color:var(--violet)}

.link{
  display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;margin-bottom:5px;
  border:1px solid transparent;transition:.13s;
}
.link:hover{background:var(--ink3);border-color:var(--line)}
.link .kind{
  font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  display:block;margin-bottom:5px;
}
.link .sent{font-size:13.5px;line-height:1.5;color:var(--mute)}
.link .sent b{font-weight:600}
.link .sent .me{color:var(--faint);font-weight:400}
.link:hover .sent{color:var(--text)}

/* ---------- trace ---------- */
.tracebar{
  padding:16px 22px;border-bottom:1px solid var(--line);background:var(--ink3);
}
.tracebar h3{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--violet);margin:0 0 10px;font-weight:500}
.slots{display:flex;align-items:center;gap:9px}
.slot{
  flex:1;min-width:0;height:38px;border-radius:9px;border:1px dashed var(--line);
  display:flex;align-items:center;padding:0 11px;font-size:12.5px;color:var(--faint);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.slot.filled{border-style:solid;color:var(--text);background:var(--ink2)}
.slot.active{border-color:var(--violet);color:var(--violet);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.5}}
.arrow{color:var(--faint);flex:none}
.tracebtns{display:flex;gap:7px;margin-top:10px}
.tracebtns button{
  flex:1;height:31px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;color:var(--mute);
}
.tracebtns button:hover{color:var(--text);border-color:var(--faint)}

.step{display:flex;gap:12px;margin-bottom:2px}
.rail{width:22px;flex:none;display:flex;flex-direction:column;align-items:center}
.rail .bead{width:11px;height:11px;border-radius:50%;margin-top:5px;flex:none;box-shadow:0 0 0 3px var(--ink2)}
.rail .stem{width:1px;flex:1;background:var(--line);min-height:14px}
.stepbody{padding-bottom:16px;flex:1;min-width:0}
.stepbody .nm{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em;display:block;text-align:left}
.stepbody .nm:hover{color:var(--violet)}
.stepbody .via{font-size:12.5px;line-height:1.5;color:var(--mute);margin-top:5px}
.stepbody .via em{font-style:normal;color:var(--violet)}
.stepbody .rev{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.08em}
.narrative{
  font-size:13.5px;line-height:1.68;color:#CFC4DE;background:var(--ink3);border-radius:11px;
  padding:14px 15px;margin-bottom:20px;
}
.narrative b{color:var(--text);font-weight:600}
.narrative i{font-style:normal;color:var(--violet)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;
  background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:9px 15px;
  font-size:13px;opacity:0;transition:.2s;pointer-events:none;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  :root{--panelW:340px}
  .search{width:180px}
  .brand .sub{display:none}
}
@media (max-width:820px){
  :root{--panelW:0px;--headH:112px}
  .head{flex-wrap:wrap;align-content:center;padding:8px 12px;gap:9px}
  .brand{width:100%}
  .tools{margin-left:0;width:100%;gap:7px;flex-wrap:wrap}
  .search{flex:1;width:auto}
  .themes{order:3;width:100%;justify-content:space-between}
  .chip{flex:1;justify-content:center;padding:0 6px}
  #stage{inset:var(--headH) 0 44% 0}
  .panel{top:auto;bottom:0;left:0;width:100%;height:44%;border-left:none;border-top:1px solid var(--line)}
  .pscroll{padding:16px}
  .panel h2.title{font-size:24px}
  .hud{display:none}
  .empty{padding:16px}
  .empty h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<header class="head">
  <div class="brand">
    <h1>The Living Syllabus</h1>
    <span class="sub">IB Biology HL &middot; 223 concepts &middot; 534 links</span>
  </div>
  <div class="tools">
    <div class="search">
      <input id="q" type="text" placeholder="Search a concept…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
      <div class="results" id="res"></div>
    </div>
    <div class="themes" id="themes"></div>
    <button class="modebtn" id="tracebtn">Trace a path</button>
  </div>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud">
  <div class="key" id="key">
    <h4>How links are drawn</h4>
    <div class="row"><svg width="34" height="8"><line x1="1" y1="4" x2="26" y2="4" stroke="#9184A8" stroke-width="1.5"/><path d="M26 1 L32 4 L26 7 Z" fill="#9184A8"/></svg> makes / becomes</div>
    <div class="row"><svg width="34" height="8"><line x1="1" y1="4" x2="26" y2="4" stroke="#9184A8" stroke-width="1.5" stroke-dasharray="5 3"/><path d="M26 1 L32 4 L26 7 Z" fill="#9184A8"/></svg> needs / depends on</div>
    <div class="row"><svg width="34" height="8"><line x1="1" y1="4" x2="26" y2="4" stroke="#9184A8" stroke-width="1.5" stroke-dasharray="1.5 3"/><path d="M26 1 L32 4 L26 7 Z" fill="#9184A8"/></svg> controls / regulates</div>
    <div class="row"><svg width="34" height="8"><line x1="1" y1="4" x2="26" y2="4" stroke="#9184A8" stroke-width="1"/><path d="M26 1 L32 4 L26 7 Z" fill="#9184A8"/></svg> is part of / is a type of</div>
    <div class="row"><svg width="34" height="8"><line x1="1" y1="4" x2="26" y2="4" stroke="#9184A8" stroke-width="1.5" stroke-dasharray="9 3 1.5 3"/><path d="M26 1 L32 4 L26 7 Z" fill="#9184A8"/></svg> is evidence for / causes</div>
  </div>
  <div class="zoombar">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">&minus;</button>
    <button id="zfit" class="wide" title="Fit everything on screen">Fit</button>
    <button id="keyt" class="wide keytoggle">Key</button>
  </div>
</div>

<aside class="panel">
  <div id="tracebar" style="display:none"></div>
  <div class="pscroll" id="panel"></div>
</aside>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script id="graphdata" type="application/json">{"nodes":[{"id":"water","label":"Water","theme":"A","code":"A1.1","hl":false,"def":"A polar molecule: oxygen pulls the shared electrons away from the two hydrogens, leaving a slight negative charge on O and slight positive charges on H."},{"id":"hbond","label":"Hydrogen bonding","theme":"A","code":"A1.1","hl":false,"def":"A temporary attraction between the delta-negative oxygen of one water molecule and the delta-positive hydrogen of another. Individually weak, collectively decisive."},{"id":"cohesion","label":"Cohesion","theme":"A","code":"A1.1","hl":false,"def":"Water molecules sticking to each other by hydrogen bonding, producing surface tension and unbroken water columns."},{"id":"adhesion","label":"Adhesion","theme":"A","code":"A1.1","hl":false,"def":"Water hydrogen-bonding to other polar surfaces, such as the walls of a xylem vessel."},{"id":"solvent","label":"Water as a solvent","theme":"A","code":"A1.1","hl":false,"def":"Water dissolves polar and charged substances, making it the medium in which almost all metabolism happens."},{"id":"thermalprops","label":"Thermal & physical properties","theme":"A","code":"A1.1","hl":false,"def":"High specific heat, high thermal conductivity, buoyancy and viscosity - all consequences of hydrogen bonding, and all shaping habitats."},{"id":"hydrophobic","label":"Hydrophilic vs hydrophobic","theme":"A","code":"A1.1","hl":false,"def":"Polar or charged substances dissolve in water (hydrophilic); non-polar ones are excluded from it (hydrophobic). This single split organises cell structure."},{"id":"asteroid","label":"Asteroid theory of water","theme":"A","code":"A1.1","hl":true,"def":"Water-bearing asteroids colliding with the molten early Earth delivered water and cooled the surface. The deuterium-to-hydrogen ratio matches."},{"id":"goldilocks","label":"Goldilocks zone","theme":"A","code":"A1.1","hl":true,"def":"The orbital band around a star where temperatures allow liquid water, and therefore life, to persist."},{"id":"dna","label":"DNA","theme":"A","code":"A1.2","hl":false,"def":"A double helix of two antiparallel nucleotide strands that stores heritable information in its base sequence."},{"id":"rna","label":"RNA","theme":"A","code":"A1.2","hl":false,"def":"A single-stranded nucleic acid using ribose and uracil, working as messenger, transfer and ribosomal RNA."},{"id":"nucleotide","label":"Nucleotide","theme":"A","code":"A1.2","hl":false,"def":"The monomer of nucleic acids: a pentose sugar, a phosphate group and a nitrogenous base."},{"id":"basepair","label":"Complementary base pairing","theme":"A","code":"A1.2","hl":false,"def":"A pairs with T (or U in RNA), G pairs with C. This is why DNA can be copied and read accurately."},{"id":"celltheory","label":"Cell theory","theme":"A","code":"A2.2","hl":false,"def":"All organisms are made of cells, the cell is the smallest unit of life, and cells come only from pre-existing cells."},{"id":"prokaryote","label":"Prokaryotic cell","theme":"A","code":"A2.2","hl":false,"def":"A cell with no nucleus or membrane-bound organelles; DNA sits free in the cytoplasm as a nucleoid, with 70S ribosomes."},{"id":"eukaryote","label":"Eukaryotic cell","theme":"A","code":"A2.2","hl":false,"def":"A compartmentalised cell with a nucleus and membrane-bound organelles, allowing incompatible reactions to run at once."},{"id":"endosymbiosis","label":"Endosymbiotic theory","theme":"A","code":"A2.2","hl":true,"def":"Mitochondria and chloroplasts descend from free-living prokaryotes engulfed by an ancestral cell - they keep their own DNA and 70S ribosomes."},{"id":"originlife","label":"Origin of the first cells","theme":"A","code":"A2.1","hl":true,"def":"Simple organic molecules formed from inorganic ones, assembled into polymers, gained catalysis and were enclosed by membranes."},{"id":"evolution","label":"Evolution","theme":"A","code":"A4.1","hl":false,"def":"The cumulative change in the heritable characteristics of a population over generations."},{"id":"natselect","label":"Natural selection","theme":"A","code":"D4.1","hl":false,"def":"Heritable variation plus overproduction plus differential survival: the individuals whose traits fit the environment leave more offspring."},{"id":"speciation","label":"Speciation","theme":"A","code":"A4.1","hl":false,"def":"The formation of a new species when populations become reproductively isolated for long enough to diverge."},{"id":"allopatric","label":"Allopatric speciation","theme":"A","code":"A4.1","hl":false,"def":"Speciation driven by a physical or geographical barrier separating populations."},{"id":"sympatric","label":"Sympatric speciation","theme":"A","code":"A4.1","hl":false,"def":"Speciation without physical separation - temporal or behavioural isolation splits a population sharing one location."},{"id":"reproisolation","label":"Reproductive isolation","theme":"A","code":"A4.1","hl":false,"def":"Any barrier - geographical, temporal or behavioural - that stops two populations interbreeding."},{"id":"adaptiveradiation","label":"Adaptive radiation","theme":"A","code":"A4.1","hl":false,"def":"Many distinct species evolving rapidly from one ancestor as members of a varied population occupy different niches."},{"id":"hybridisation","label":"Hybridisation","theme":"A","code":"A4.1","hl":true,"def":"Fertilisation between two different species. The chromosome mismatch usually makes the hybrid sterile - mules, ligers, zorses."},{"id":"polyploidy","label":"Polyploidy","theme":"A","code":"A4.1","hl":true,"def":"Cells carrying three or more chromosome sets. Common in plants, it can create a new species abruptly, in one generation."},{"id":"homologous","label":"Homologous structures","theme":"A","code":"A4.1","hl":false,"def":"Features alike in structure but different in function, such as the pentadactyl limb. Evidence of a common ancestor."},{"id":"analogous","label":"Analogous structures","theme":"A","code":"A4.1","hl":false,"def":"Features alike in function but different in structure, such as the fins of a shark and an orca. No recent common ancestor."},{"id":"convergent","label":"Convergent evolution","theme":"A","code":"A4.1","hl":false,"def":"Unrelated species evolving similar traits under similar selective pressures."},{"id":"divergent","label":"Divergent evolution","theme":"A","code":"A4.1","hl":false,"def":"Two or more species accumulating differences from a shared ancestor and becoming more distinct."},{"id":"selectivebreeding","label":"Selective breeding","theme":"A","code":"A4.1","hl":false,"def":"Humans choosing which organisms reproduce, as with teosinte to maize or wolves to dog breeds. Evolution on a visible timescale."},{"id":"molecularevidence","label":"Molecular evidence","theme":"A","code":"A4.1","hl":false,"def":"Differences in DNA and protein sequences accumulate over time, so sequence similarity measures how recently species shared an ancestor."},{"id":"carbon","label":"Carbon chemistry","theme":"B","code":"B1.1","hl":false,"def":"Carbon forms four covalent bonds, so it can build long chains, branches and rings - the skeleton of every macromolecule."},{"id":"macromolecule","label":"Monomers & polymers","theme":"B","code":"B1.1","hl":false,"def":"Small repeating subunits (monomers) joined into large molecules (polymers): monosaccharides, amino acids, nucleotides, fatty acids."},{"id":"condensation","label":"Condensation reaction","theme":"B","code":"B1.1","hl":false,"def":"Two monomers join with a covalent bond and one water molecule is released. Builds every polymer in the cell."},{"id":"hydrolysis","label":"Hydrolysis","theme":"B","code":"B1.1","hl":false,"def":"Water is added to split a covalent bond, breaking a polymer back into monomers. Digestion in one word."},{"id":"monosaccharide","label":"Monosaccharide","theme":"B","code":"B1.1","hl":false,"def":"Single sugars with the general formula CnH2nOn, including the hexose glucose and the pentose ribose."},{"id":"glucose","label":"Glucose","theme":"B","code":"B1.1","hl":false,"def":"The central hexose sugar: soluble, transportable, chemically stable, and the main substrate of respiration."},{"id":"glucoseisomers","label":"Alpha & beta glucose","theme":"B","code":"B1.1","hl":false,"def":"Two isomers differing only in whether the OH on carbon 1 sits below or above the ring - and that tiny difference decides starch versus cellulose."},{"id":"disaccharide","label":"Disaccharide","theme":"B","code":"B1.1","hl":false,"def":"Two monosaccharides joined by a glycosidic bond: maltose, lactose and sucrose."},{"id":"polysaccharide","label":"Polysaccharide","theme":"B","code":"B1.1","hl":false,"def":"Many monosaccharides joined into storage or structural molecules."},{"id":"starch","label":"Starch","theme":"B","code":"B1.1","hl":false,"def":"The plant storage polysaccharide: helical amylose plus branched amylopectin, both from alpha glucose."},{"id":"glycogen","label":"Glycogen","theme":"B","code":"B1.1","hl":false,"def":"The animal storage polysaccharide - more branched than amylopectin, so it can be hydrolysed quickly when glucose is needed."},{"id":"cellulose","label":"Cellulose","theme":"B","code":"B1.1","hl":false,"def":"A straight, unbranched beta glucose polymer. Alternate molecules flip, letting hydrogen bonds link chains into strong microfibrils."},{"id":"lipid","label":"Lipid","theme":"B","code":"B1.1","hl":false,"def":"Non-polar molecules - fats, oils, waxes and steroids - used for storage, insulation, membranes and signalling."},{"id":"fattyacid","label":"Fatty acid","theme":"B","code":"B1.1","hl":false,"def":"A hydrocarbon tail with a carboxyl group at one end. Chain length and double bonds set the melting point."},{"id":"saturation","label":"Saturated & unsaturated","theme":"B","code":"B1.1","hl":false,"def":"Saturated tails are straight and pack tightly (solid fats); unsaturated tails kink at each double bond and stay liquid (oils)."},{"id":"triglyceride","label":"Triglyceride","theme":"B","code":"B1.1","hl":false,"def":"Three fatty acids ester-bonded to one glycerol. The densest energy store in the body."},{"id":"phospholipid","label":"Phospholipid","theme":"B","code":"B1.1","hl":false,"def":"Two fatty acids and a phosphate on glycerol - a molecule with a water-loving head and water-fearing tails."},{"id":"cholesterol","label":"Cholesterol","theme":"B","code":"B1.1","hl":false,"def":"A steroid lipid with a small hydrophilic region, able to sit inside membranes and cross them."},{"id":"steroidhormone","label":"Steroid hormone","theme":"B","code":"B1.1","hl":false,"def":"Testosterone, oestradiol and relatives, built from cholesterol by gonadal tissue."},{"id":"glycoprotein","label":"Glycoprotein & glycolipid","theme":"B","code":"B1.1","hl":false,"def":"Carbohydrate chains attached to membrane proteins or lipids, used for recognition, signalling and adhesion."},{"id":"aminoacid","label":"Amino acid","theme":"B","code":"B1.2","hl":false,"def":"The monomer of proteins: a central carbon carrying an amine group, a carboxyl group, a hydrogen and a variable R group."},{"id":"rgroup","label":"R group","theme":"B","code":"B1.2","hl":true,"def":"The 20 amino acids differ only here. R groups are non-polar, polar, or ionised - and that chemistry dictates how a chain folds."},{"id":"peptidebond","label":"Peptide bond","theme":"B","code":"B1.2","hl":false,"def":"The covalent link formed by condensation between the carboxyl group of one amino acid and the amine group of the next."},{"id":"polypeptide","label":"Polypeptide","theme":"B","code":"B1.2","hl":false,"def":"A chain of many amino acids linked by peptide bonds."},{"id":"primary","label":"Primary structure","theme":"B","code":"B1.2","hl":true,"def":"The number and sequence of amino acids, set by the gene. Everything above it follows from this."},{"id":"secondary","label":"Secondary structure","theme":"B","code":"B1.2","hl":true,"def":"Alpha helices and beta pleated sheets held by hydrogen bonds between the carboxyl and amine groups of non-adjacent amino acids."},{"id":"tertiary","label":"Tertiary structure","theme":"B","code":"B1.2","hl":true,"def":"The full 3D shape, held by R group interactions: hydrogen bonds, ionic bonds, disulfide bridges and hydrophobic clustering."},{"id":"quaternary","label":"Quaternary structure","theme":"B","code":"B1.2","hl":true,"def":"Two or more polypeptides bound into one functional protein, sometimes with a non-protein group such as haem."},{"id":"denaturation","label":"Denaturation","theme":"B","code":"B1.2","hl":false,"def":"Unsuitable temperature or pH alters the 3D structure, so the protein loses its function. Peptide bonds stay intact."},{"id":"globularfibrous","label":"Globular vs fibrous","theme":"B","code":"B1.2","hl":true,"def":"Globular proteins are roughly spherical, soluble and functional; fibrous proteins are long, insoluble and structural."},{"id":"haemoglobin","label":"Haemoglobin","theme":"B","code":"B1.2","hl":false,"def":"A conjugated quaternary protein of four polypeptides, each with an iron-containing haem group that reversibly binds one oxygen."},{"id":"collagen","label":"Collagen","theme":"B","code":"B1.2","hl":false,"def":"A fibrous protein of three helical chains giving tensile strength to tendons and ligaments and elasticity to skin."},{"id":"insulin","label":"Insulin","theme":"B","code":"B1.2","hl":false,"def":"A small protein hormone from pancreatic beta cells that lowers blood glucose. Made as pre-proinsulin and cut into shape."},{"id":"keratin","label":"Keratin","theme":"B","code":"B1.2","hl":false,"def":"A fibrous structural protein forming hair, nails, claws and hooves."},{"id":"histone","label":"Histone","theme":"B","code":"B1.2","hl":false,"def":"Nuclear proteins that DNA supercoils around to package chromosomes."},{"id":"membrane","label":"Phospholipid bilayer","theme":"B","code":"B2.1","hl":false,"def":"Two sheets of phospholipids with hydrophilic heads facing the water and hydrophobic tails facing each other. The basic membrane of every cell."},{"id":"fluidmosaic","label":"Fluid mosaic model","theme":"B","code":"B2.1","hl":false,"def":"A fluid bilayer studded with a mosaic of proteins that drift within it."},{"id":"amphipathic","label":"Amphipathic molecules","theme":"B","code":"B1.1","hl":false,"def":"Molecules with both a polar and a non-polar region, so they sit at the boundary between water and oil."},{"id":"membraneprotein","label":"Membrane protein","theme":"B","code":"B2.1","hl":false,"def":"Integral and peripheral proteins acting as channels, pumps, receptors, enzymes and recognition markers."},{"id":"simplediffusion","label":"Simple diffusion","theme":"B","code":"B2.1","hl":false,"def":"Small non-polar molecules such as oxygen and carbon dioxide passing straight through the bilayer down their concentration gradient."},{"id":"faciliteddiffusion","label":"Facilitated diffusion","theme":"B","code":"B2.1","hl":false,"def":"Polar or charged particles crossing through channel or carrier proteins, still down the gradient and still without ATP."},{"id":"osmosis","label":"Osmosis","theme":"B","code":"B2.1","hl":false,"def":"Net movement of water across a partially permeable membrane from higher to lower water potential."},{"id":"waterpotential","label":"Water potential","theme":"B","code":"D2.3","hl":true,"def":"The tendency of water to leave a solution. Adding solute lowers it; hypertonic, hypotonic and isotonic describe the comparison."},{"id":"activetransport","label":"Active transport","theme":"B","code":"B2.1","hl":false,"def":"Pump proteins moving substances against the concentration gradient, paid for with ATP."},{"id":"bulktransport","label":"Endocytosis & exocytosis","theme":"B","code":"B2.1","hl":false,"def":"Moving large loads by wrapping them in vesicles of membrane, in or out."},{"id":"mitochondrion","label":"Mitochondrion","theme":"B","code":"B2.2","hl":false,"def":"The organelle of aerobic respiration: a matrix for the Krebs cycle, and a folded inner membrane packed with electron carriers."},{"id":"chloroplast","label":"Chloroplast","theme":"B","code":"B2.2","hl":false,"def":"The organelle of photosynthesis: stacked thylakoids for the light-dependent reactions and a fluid stroma for the Calvin cycle."},{"id":"nucleus","label":"Nucleus","theme":"B","code":"B2.2","hl":false,"def":"The compartment holding the DNA, where transcription and splicing happen away from the ribosomes."},{"id":"ribosome","label":"Ribosome","theme":"B","code":"B2.2","hl":false,"def":"The two-subunit structure of rRNA and protein where mRNA is translated into a polypeptide."},{"id":"er","label":"Endoplasmic reticulum","theme":"B","code":"B2.2","hl":false,"def":"Rough ER studded with ribosomes processes proteins for secretion; smooth ER handles lipids."},{"id":"golgi","label":"Golgi apparatus","theme":"B","code":"B2.2","hl":false,"def":"Modifies, sorts and packages proteins into vesicles for export."},{"id":"lysosome","label":"Lysosome","theme":"B","code":"B2.2","hl":false,"def":"A vesicle of hydrolytic enzymes, including proteases that break peptide bonds."},{"id":"differentiation","label":"Differentiation","theme":"B","code":"B2.3","hl":false,"def":"Cells switching some genes on and others off, so identical genomes produce over 200 cell types."},{"id":"stemcell","label":"Stem cell","theme":"B","code":"B2.3","hl":false,"def":"Unspecialised cells that can divide indefinitely and still differentiate. In plants they sit in meristems."},{"id":"morphogen","label":"Morphogen","theme":"B","code":"B2.3","hl":true,"def":"Signal molecules forming concentration gradients in the embryo, telling cells in different regions which genes to express."},{"id":"rbc","label":"Red blood cell","theme":"B","code":"B2.3","hl":false,"def":"Biconcave, nucleus-free and flexible - shape, space and size all sacrificed to carrying haemoglobin."},{"id":"alveolus","label":"Alveolus","theme":"B","code":"B3.1","hl":false,"def":"Thin-walled air sacs with a huge surface area and dense capillaries, where oxygen enters the blood and carbon dioxide leaves."},{"id":"musclefibre","label":"Muscle fibre","theme":"B","code":"B2.3","hl":false,"def":"Cardiac, skeletal and smooth cells specialised to shorten, packed with mitochondria to pay for contraction."},{"id":"gamete","label":"Gamete","theme":"B","code":"B2.3","hl":false,"def":"Haploid sex cells. The sperm is stripped down for swimming; the egg is stocked for development."},{"id":"meristem","label":"Meristem","theme":"B","code":"B2.3","hl":false,"def":"Regions of undifferentiated dividing plant cells at root and shoot tips (apical) and at the sides (lateral)."},{"id":"circulation","label":"Double circulation","theme":"B","code":"B3.2","hl":false,"def":"Blood passes through the heart twice: pulmonary circulation to the lungs, systemic circulation to the body."},{"id":"artery","label":"Artery","theme":"B","code":"B3.2","hl":false,"def":"Thick, muscular, elastic vessels carrying blood away from the heart. They stretch under each beat and recoil between beats."},{"id":"vein","label":"Vein","theme":"B","code":"B3.2","hl":false,"def":"Thin-walled, large-lumen vessels returning blood to the heart, with valves preventing backflow."},{"id":"capillary","label":"Capillary","theme":"B","code":"B3.2","hl":false,"def":"One cell thick, highly branched and permeable - the only vessels where exchange actually happens."},{"id":"chd","label":"Coronary heart disease","theme":"B","code":"B3.2","hl":false,"def":"Plaque narrowing the coronary arteries so cardiac muscle is starved of oxygen. A multifactorial disease."},{"id":"xylem","label":"Xylem","theme":"B","code":"B3.2","hl":false,"def":"Dead, hollow cell walls forming pipes that carry water and minerals up from the roots."},{"id":"phloem","label":"Phloem","theme":"B","code":"B3.2","hl":false,"def":"Living tissue transporting sugars from the leaves to the rest of the plant."},{"id":"transpiration","label":"Transpiration","theme":"B","code":"B3.2","hl":false,"def":"Evaporation of water from leaves through open stomata, creating the negative pressure that pulls the whole water column up."},{"id":"gasexchange","label":"Gas exchange","theme":"B","code":"B3.1","hl":false,"def":"Oxygen moving into the blood and carbon dioxide out, across a thin, moist, well-ventilated surface with a big area."},{"id":"enzyme","label":"Enzyme","theme":"C","code":"C1.1","hl":false,"def":"Biological catalysts, almost always globular proteins, that speed up reactions by lowering activation energy without being changed."},{"id":"activesite","label":"Active site","theme":"C","code":"C1.1","hl":false,"def":"The pocket on an enzyme whose shape is complementary to the substrate. Shape decides specificity, and shape comes from folding."},{"id":"inducedfit","label":"Induced fit model","theme":"C","code":"C1.1","hl":false,"def":"Enzyme and substrate change shape slightly on binding, giving a closer fit and straining the substrate's bonds. It replaced lock and key."},{"id":"activationenergy","label":"Activation energy","theme":"C","code":"C1.1","hl":false,"def":"The energy needed to destabilise existing bonds so a reaction can proceed. Catalysts lower it in both directions."},{"id":"collisiontheory","label":"Collision theory","theme":"C","code":"C1.1","hl":false,"def":"Reactants must collide with enough energy and in the correct orientation for a reaction to happen."},{"id":"catabolism","label":"Catabolism","theme":"C","code":"C1.1","hl":false,"def":"Breaking macromolecules into monomers, releasing energy. Exergonic - products are more stable than reactants."},{"id":"anabolism","label":"Anabolism","theme":"C","code":"C1.1","hl":false,"def":"Building macromolecules from monomers, which costs energy. Endergonic - products hold more chemical energy."},{"id":"enzymefactors","label":"Temperature, pH & substrate","theme":"C","code":"C1.1","hl":false,"def":"Rate rises with temperature and substrate concentration until denaturation or saturation of active sites caps it. Every enzyme has an optimum pH."},{"id":"inhibition","label":"Enzyme inhibition","theme":"C","code":"C1.1","hl":true,"def":"Competitive inhibitors block the active site and can be outcompeted; non-competitive ones bind an allosteric site; mechanism-based ones bind irreversibly."},{"id":"feedbackinhibition","label":"Feedback inhibition","theme":"C","code":"C1.1","hl":true,"def":"The end product of a pathway inhibits the enzyme catalysing the first step, so the cell stops making what it already has."},{"id":"cofactor","label":"Cofactor","theme":"C","code":"C1.1","hl":true,"def":"Non-protein helpers, often inorganic ions or vitamins, that an enzyme needs before it will work."},{"id":"metabolicpathway","label":"Metabolic pathway","theme":"C","code":"C1.1","hl":true,"def":"Chains or cycles of reactions, each step with its own specific enzyme. Glycolysis is linear; the Krebs cycle is cyclical."},{"id":"respiration","label":"Cell respiration","theme":"C","code":"C1.2","hl":false,"def":"The controlled, stepwise breakdown of nutrients to release energy as ATP. A redox process throughout."},{"id":"glycolysis","label":"Glycolysis","theme":"C","code":"C1.2","hl":true,"def":"In the cytoplasm: glucose is phosphorylated, split into two triose phosphates, oxidised and converted to two pyruvate. Net yield 2 ATP and 2 NADH."},{"id":"linkreaction","label":"Link reaction","theme":"C","code":"C1.2","hl":true,"def":"In the matrix: pyruvate is decarboxylated and oxidised to a 2-carbon acetyl group, which joins coenzyme A. Yields NADH and CO2."},{"id":"krebs","label":"Krebs cycle","theme":"C","code":"C1.2","hl":true,"def":"Acetyl CoA joins oxaloacetate to form citrate, which is decarboxylated and oxidised back to oxaloacetate. Runs twice per glucose."},{"id":"etc","label":"Electron transport chain","theme":"C","code":"C1.2","hl":true,"def":"Electrons from NADH and FADH2 pass down carriers in the inner mitochondrial membrane, and the energy released pumps protons into the intermembrane space."},{"id":"chemiosmosis","label":"Chemiosmosis","theme":"C","code":"C1.2","hl":true,"def":"Protons flow back down their gradient through ATP synthase, and that flow phosphorylates ADP into ATP."},{"id":"atpsynthase","label":"ATP synthase","theme":"C","code":"C1.2","hl":true,"def":"The membrane enzyme that converts the energy of a proton gradient into the chemical bond energy of ATP."},{"id":"protongradient","label":"Proton gradient","theme":"C","code":"C1.2","hl":true,"def":"A store of potential energy created by pumping H+ across a membrane. Made the same way in mitochondria and chloroplasts."},{"id":"nadh","label":"NADH","theme":"C","code":"C1.2","hl":true,"def":"The reduced carrier that ferries hydrogen and electrons from glycolysis, the link reaction and the Krebs cycle to the chain. Worth about 2.5 ATP."},{"id":"fadh2","label":"FADH2","theme":"C","code":"C1.2","hl":true,"def":"A reduced carrier from the Krebs cycle that joins the chain later than NADH, so it yields about 1.5 ATP."},{"id":"redox","label":"Redox reaction","theme":"C","code":"C1.2","hl":true,"def":"Oxidation is loss of electrons and hydrogen; reduction is gain. They always happen together, and energy moves with the electrons."},{"id":"oxygen","label":"Oxygen as final acceptor","theme":"C","code":"C1.2","hl":true,"def":"Oxygen takes the spent electrons and two protons at the end of the chain to form water. Without it the chain backs up and stops."},{"id":"anaerobic","label":"Anaerobic respiration","theme":"C","code":"C1.2","hl":false,"def":"Without oxygen, pyruvate is converted to lactate in animals or to ethanol and CO2 in yeast, purely to regenerate NAD+ so glycolysis can continue."},{"id":"atp","label":"ATP","theme":"C","code":"C1.2","hl":false,"def":"The cell's usable energy currency, spent on active transport, anabolism, movement and signalling."},{"id":"substrates","label":"Other respiratory substrates","theme":"C","code":"C1.2","hl":true,"def":"Lipids, glycerol, amino acids and other sugars enter respiration at different points. Lipids give about 20% more ATP per gram."},{"id":"photosynthesis","label":"Photosynthesis","theme":"C","code":"C1.3","hl":false,"def":"Building organic molecules from carbon dioxide and water using light energy. The reverse equation of respiration."},{"id":"lightdependent","label":"Light-dependent reactions","theme":"C","code":"C1.3","hl":false,"def":"In the thylakoid membranes: light excites electrons, water is split, and ATP and NADPH are generated."},{"id":"photolysis","label":"Photolysis","theme":"C","code":"C1.3","hl":false,"def":"Light splitting water to replace the electrons lost by photosystem II, releasing protons and oxygen as waste."},{"id":"photosystem","label":"Photosystems I & II","theme":"C","code":"C1.3","hl":true,"def":"Pigment complexes that funnel light energy to a chlorophyll a reaction centre. PSII (P680) starts the chain; PSI (P700) reduces NADP+."},{"id":"photophosphorylation","label":"Photophosphorylation","theme":"C","code":"C1.3","hl":true,"def":"ATP synthesis driven by a proton gradient across the thylakoid membrane. Non-cyclic yields ATP, NADPH and O2; cyclic yields ATP only."},{"id":"calvin","label":"Calvin cycle","theme":"C","code":"C1.3","hl":false,"def":"In the stroma: carbon dioxide is fixed onto RuBP, reduced to triose phosphate using ATP and NADPH, and RuBP is regenerated."},{"id":"rubisco","label":"Rubisco","theme":"C","code":"C1.3","hl":true,"def":"The enzyme that fixes carbon dioxide onto RuBP - the most abundant enzyme on Earth and the bottleneck of the whole cycle."},{"id":"rubp","label":"RuBP","theme":"C","code":"C1.3","hl":true,"def":"The 5-carbon acceptor of carbon dioxide. Six turns of the cycle regenerate it and release enough triose phosphate for one glucose."},{"id":"gptp","label":"GP & triose phosphate","theme":"C","code":"C1.3","hl":true,"def":"The unstable 6-carbon product splits into two glycerate-3-phosphate, which ATP and NADPH reduce to triose phosphate."},{"id":"nadph","label":"NADPH","theme":"C","code":"C1.3","hl":true,"def":"The reduced carrier made by the light-dependent reactions and spent reducing GP in the Calvin cycle."},{"id":"chlorophyll","label":"Chlorophyll & pigments","theme":"C","code":"C1.3","hl":false,"def":"Chlorophyll a and b absorb violet-blue and red light and reflect green. Carotene and xanthophyll widen the range absorbed."},{"id":"spectra","label":"Absorption & action spectrum","theme":"C","code":"C1.3","hl":false,"def":"An absorption spectrum shows which wavelengths a pigment takes in; an action spectrum shows which wavelengths actually drive photosynthesis."},{"id":"chromatography","label":"Chromatography","theme":"C","code":"C1.3","hl":false,"def":"Separating leaf pigments by solubility in a solvent. The Rf value is distance moved by the pigment over distance moved by the solvent."},{"id":"limitingfactors","label":"Limiting factors","theme":"C","code":"C1.3","hl":false,"def":"Light intensity, carbon dioxide concentration and temperature each cap the rate. Beyond a plateau, adding more of one changes nothing."},{"id":"cellsignalling","label":"Cell signalling","theme":"C","code":"C2.1","hl":false,"def":"One cell releasing a chemical that changes the behaviour of another. No receptor means no response."},{"id":"ligand","label":"Ligand","theme":"C","code":"C2.1","hl":false,"def":"Molecules that bind reversibly to a receptor: hormones, neurotransmitters, cytokines and calcium ions."},{"id":"receptor","label":"Receptor","theme":"C","code":"C2.1","hl":false,"def":"Proteins with a binding site complementary to one ligand. Hydrophilic ligands bind surface receptors; hydrophobic ones cross the membrane."},{"id":"transduction","label":"Signal transduction","theme":"C","code":"C2.1","hl":true,"def":"The cascade of steps converting a signal at the membrane into a response inside the cell, often amplifying it hugely."},{"id":"hormone","label":"Hormone","theme":"C","code":"C2.1","hl":false,"def":"Chemical messengers released by endocrine cells into the blood, acting slowly on distant target cells."},{"id":"neurotransmitter","label":"Neurotransmitter","theme":"C","code":"C2.2","hl":false,"def":"Chemicals released from a neuron into a synapse, acting fast on immediate neighbours."},{"id":"neuron","label":"Neuron","theme":"C","code":"C2.2","hl":false,"def":"Cells specialised to carry electrical signals long distances along an axon."},{"id":"actionpotential","label":"Action potential","theme":"C","code":"C2.2","hl":false,"def":"A wave of depolarisation and repolarisation caused by sodium and potassium ions moving through voltage-gated channels."},{"id":"restingpotential","label":"Resting potential","theme":"C","code":"C2.2","hl":false,"def":"The negative charge held inside an axon at rest, maintained by the sodium-potassium pump using ATP."},{"id":"synapse","label":"Synapse","theme":"C","code":"C2.2","hl":false,"def":"The junction where an electrical signal becomes a chemical one: vesicles release neurotransmitter across the gap onto receptors."},{"id":"myelin","label":"Myelination","theme":"C","code":"C2.2","hl":true,"def":"An insulating sheath forcing the impulse to jump between nodes, so myelinated axons conduct far faster."},{"id":"nervoussystem","label":"Nervous system","theme":"C","code":"C3.1","hl":false,"def":"Fast, electrical, short-lived signalling to specific targets."},{"id":"endocrine","label":"Endocrine system","theme":"C","code":"C3.1","hl":false,"def":"Slow, chemical, longer-lasting signalling broadcast through the blood."},{"id":"hypothalamus","label":"Hypothalamus","theme":"C","code":"C3.1","hl":false,"def":"The brain's control centre for homeostasis - it senses deviations and commands the pituitary and the rest of the body."},{"id":"pituitary","label":"Pituitary gland","theme":"C","code":"C3.1","hl":false,"def":"The gland that translates hypothalamic instructions into hormones controlling other endocrine glands."},{"id":"kidney","label":"Kidney & nephron","theme":"C","code":"C3.1","hl":false,"def":"Filters blood and adjusts water and solute loss, keeping blood composition steady."},{"id":"pathogen","label":"Pathogen","theme":"C","code":"C3.2","hl":false,"def":"Organisms or viruses that cause disease - bacteria, viruses, fungi, protists."},{"id":"antigen","label":"Antigen","theme":"C","code":"C3.2","hl":false,"def":"Molecules, usually surface proteins or glycoproteins, recognised as self or non-self."},{"id":"antibody","label":"Antibody","theme":"C","code":"C3.2","hl":false,"def":"Proteins made by plasma cells that bind one specific antigen and mark it for destruction."},{"id":"bcell","label":"B-cell & plasma cell","theme":"C","code":"C3.2","hl":false,"def":"Lymphocytes that recognise an antigen, clone themselves and secrete antibodies. Memory cells make the second response fast."},{"id":"tcell","label":"T-cell","theme":"C","code":"C3.2","hl":false,"def":"Lymphocytes that activate B-cells and coordinate the immune response. Their loss is what makes HIV dangerous."},{"id":"phagocyte","label":"Phagocyte","theme":"C","code":"C3.2","hl":false,"def":"White blood cells that engulf pathogens by endocytosis and digest them with lysosomal enzymes."},{"id":"vaccine","label":"Vaccine","theme":"C","code":"C3.2","hl":false,"def":"A safe first exposure to an antigen, so memory cells exist before the real pathogen arrives."},{"id":"herdimmunity","label":"Herd immunity","theme":"C","code":"C3.2","hl":false,"def":"When enough of a population is immune, transmission slows so much that unvaccinated individuals are protected too."},{"id":"abo","label":"ABO blood group","theme":"C","code":"C3.2","hl":false,"def":"Glycoprotein antigens on red blood cells. You make antibodies against the antigens you lack, which is why transfusions must match."},{"id":"agglutination","label":"Agglutination","theme":"C","code":"C3.2","hl":false,"def":"Recipient antibodies binding donor red blood cells and clumping them, blocking vessels. The danger of a mismatched transfusion."},{"id":"hiv","label":"HIV & AIDS","theme":"C","code":"C3.2","hl":false,"def":"A virus that destroys T-cells. Once their number falls far enough, opportunistic infections take hold and the disease is AIDS."},{"id":"antibiotic","label":"Antibiotic","theme":"C","code":"C3.2","hl":false,"def":"Drugs targeting bacterial cell walls and 70S ribosomes. They cannot touch viruses, and they leave our 80S ribosomes alone."},{"id":"zoonotic","label":"Zoonotic disease","theme":"C","code":"C3.2","hl":false,"def":"A pathogen crossing from another species into humans - rabies, tuberculosis, Covid-19."},{"id":"dnareplication","label":"DNA replication","theme":"D","code":"D1.1","hl":false,"def":"Semi-conservative copying: the helix unwinds, each strand templates a new partner, and each daughter molecule keeps one old strand."},{"id":"helicasepol","label":"Helicase & DNA polymerase","theme":"D","code":"D1.1","hl":false,"def":"Helicase unwinds and separates the strands; DNA polymerase adds complementary nucleotides in the 5' to 3' direction."},{"id":"pcr","label":"PCR","theme":"D","code":"D1.1","hl":false,"def":"Replication run in a machine to amplify a DNA sample, using heat to separate strands and a heat-stable polymerase."},{"id":"transcription","label":"Transcription","theme":"D","code":"D1.2","hl":false,"def":"Copying a gene into mRNA in the nucleus. RNA polymerase binds the promoter and reads the antisense strand 5' to 3'."},{"id":"rnapolymerase","label":"RNA polymerase","theme":"D","code":"D1.2","hl":false,"def":"The enzyme that unwinds DNA and assembles mRNA by complementary base pairing until it reaches the terminator."},{"id":"transcriptionfactor","label":"Transcription factor","theme":"D","code":"D1.2","hl":true,"def":"Regulatory proteins binding non-coding regions to activate or repress a gene. The main switch of gene expression in eukaryotes."},{"id":"mrna","label":"mRNA","theme":"D","code":"D1.2","hl":false,"def":"The transcript carrying a gene's message from nucleus to ribosome."},{"id":"splicing","label":"Splicing","theme":"D","code":"D1.2","hl":true,"def":"Spliceosomes cut introns out of pre-mRNA and join the exons, producing mature mRNA. Prokaryotes skip this - they have no introns."},{"id":"altsplicing","label":"Alternative splicing","theme":"D","code":"D1.2","hl":true,"def":"Removing some exons as well, so one gene can yield several different proteins - tropomyosin differs between muscle types this way."},{"id":"capptail","label":"5' cap & poly-A tail","theme":"D","code":"D1.2","hl":true,"def":"Added to mature mRNA to allow nuclear export, protect it from degradation and help ribosomes start translation."},{"id":"translation","label":"Translation","theme":"D","code":"D1.2","hl":false,"def":"Ribosomes read mRNA codon by codon and build the matching amino acid sequence, through initiation, elongation and termination."},{"id":"trna","label":"tRNA","theme":"D","code":"D1.2","hl":false,"def":"A clover-shaped RNA carrying one amino acid at one end and the complementary anticodon at the other."},{"id":"codon","label":"Codon & anticodon","theme":"D","code":"D1.2","hl":false,"def":"Three consecutive mRNA bases specify one amino acid. AUG starts; UAA, UAG and UGA stop."},{"id":"geneticcode","label":"The genetic code","theme":"D","code":"D1.2","hl":false,"def":"Degenerate, because several codons can specify one amino acid, and universal, because it is shared across life."},{"id":"posttranslational","label":"Post-translational modification","theme":"D","code":"D1.2","hl":true,"def":"Cutting, folding, glycosylation and disulfide bonding turn a raw polypeptide into a working protein - pre-proinsulin becomes insulin."},{"id":"proteasome","label":"Ubiquitin & proteasome","theme":"D","code":"D1.2","hl":true,"def":"Ubiquitin tags worn or unwanted proteins, and the proteasome dismantles them back into reusable amino acids."},{"id":"noncodingdna","label":"Non-coding DNA","theme":"D","code":"D1.2","hl":true,"def":"About 99% of the genome. It includes promoters, enhancers, silencers, introns, telomeres and the genes for tRNA and rRNA."},{"id":"geneexpression","label":"Gene expression","theme":"D","code":"D2.2","hl":false,"def":"Which genes a cell actually uses. Every cell holds the whole genome but reads only the part its role requires."},{"id":"mutation","label":"Mutation","theme":"D","code":"D1.3","hl":false,"def":"A permanent change to a DNA base sequence, because replication is not perfect."},{"id":"pointmutation","label":"Point mutation","theme":"D","code":"D1.3","hl":false,"def":"A single base substitution. It can change one codon, one amino acid, and therefore the whole protein."},{"id":"sicklecell","label":"Sickle cell disease","theme":"D","code":"D1.3","hl":false,"def":"One base change in the haemoglobin gene swaps one amino acid, so red cells sickle, block vessels and carry oxygen poorly."},{"id":"mutagen","label":"Mutagen","theme":"D","code":"D1.3","hl":false,"def":"External agents such as radiation or cigarette smoke that raise the mutation rate."},{"id":"cellcycle","label":"The cell cycle","theme":"D","code":"D2.1","hl":false,"def":"Interphase (G1, S, G2) for growth and DNA replication, then mitosis and cytokinesis. Some cells exit into a non-dividing G0."},{"id":"interphase","label":"Interphase","theme":"D","code":"D2.1","hl":false,"def":"The longest phase: the cell grows, replicates its organelles and copies its DNA, which stays uncondensed."},{"id":"mitosis","label":"Mitosis","theme":"D","code":"D2.1","hl":false,"def":"Prophase, metaphase, anaphase and telophase divide one nucleus into two genetically identical nuclei."},{"id":"cytokinesis","label":"Cytokinesis","theme":"D","code":"D2.1","hl":false,"def":"Division of the cytoplasm, completing the production of two separate cells."},{"id":"meiosis","label":"Meiosis","theme":"D","code":"D2.1","hl":false,"def":"Two divisions halving the chromosome number and producing four genetically different haploid cells."},{"id":"crossingover","label":"Crossing over","theme":"D","code":"D2.1","hl":false,"def":"Homologous chromosomes exchange segments in prophase I, creating new allele combinations on a chromosome."},{"id":"independentassort","label":"Independent assortment","theme":"D","code":"D2.1","hl":false,"def":"Homologous pairs line up independently in metaphase I, so maternal and paternal chromosomes are shuffled between gametes."},{"id":"cyclin","label":"Cyclin & CDK","theme":"D","code":"D2.1","hl":true,"def":"Cyclins accumulate and activate cyclin-dependent kinases, which phosphorylate targets and push the cell into the next phase."},{"id":"checkpoint","label":"Cell cycle checkpoint","theme":"D","code":"D2.1","hl":true,"def":"Control points, notably G1 and G2, that halt the cycle until conditions and DNA integrity are right."},{"id":"cancer","label":"Cancer","theme":"D","code":"D2.1","hl":false,"def":"Uncontrolled division producing a tumour. Benign tumours stay put; malignant ones invade and metastasise."},{"id":"oncogene","label":"Oncogene","theme":"D","code":"D2.1","hl":false,"def":"Mutated proto-oncogenes that tell a cell to divide too often or to skip apoptosis."},{"id":"tumoursuppressor","label":"Tumour suppressor gene","theme":"D","code":"D2.1","hl":false,"def":"Genes coding for proteins that restrain division and trigger apoptosis. Losing their function releases the brake."},{"id":"apoptosis","label":"Apoptosis","theme":"D","code":"D2.1","hl":false,"def":"Programmed cell death - a normal, controlled removal of cells that are damaged or no longer needed."},{"id":"mitoticindex","label":"Mitotic index","theme":"D","code":"D2.1","hl":false,"def":"Cells in mitosis divided by total cells. A high value means rapid proliferation and predicts response to chemotherapy."},{"id":"allele","label":"Allele","theme":"D","code":"D3.2","hl":false,"def":"Different versions of the same gene, occupying the same locus on homologous chromosomes."},{"id":"genotypephenotype","label":"Genotype & phenotype","theme":"D","code":"D3.2","hl":false,"def":"The alleles an organism carries, and the characteristics that result from them interacting with the environment."},{"id":"punnett","label":"Punnett grid","theme":"D","code":"D3.2","hl":false,"def":"A grid predicting the genotype ratios of offspring from the gametes each parent can make."},{"id":"sexlinkage","label":"Sex linkage","theme":"D","code":"D3.2","hl":false,"def":"Genes carried on the X chromosome. Males, with only one X, show recessive X-linked conditions far more often."},{"id":"pedigree","label":"Pedigree chart","theme":"D","code":"D3.2","hl":false,"def":"Family diagrams used to trace how an allele is inherited and to deduce unknown genotypes."},{"id":"variation","label":"Genetic variation","theme":"D","code":"D3.2","hl":false,"def":"The raw material of evolution, generated by mutation, crossing over, independent assortment and random fertilisation."},{"id":"homeostasis","label":"Homeostasis","theme":"D","code":"D3.3","hl":false,"def":"Keeping internal conditions within narrow limits despite a changing environment."},{"id":"negfeedback","label":"Negative feedback","theme":"D","code":"D3.3","hl":false,"def":"A deviation from the set point triggers a response that reverses it. The logic behind nearly every homeostatic system."},{"id":"bloodglucose","label":"Blood glucose regulation","theme":"D","code":"D3.3","hl":false,"def":"Beta cells release insulin when glucose is high; alpha cells release glucagon when it is low. Both act mainly on the liver."},{"id":"glucagon","label":"Glucagon","theme":"D","code":"D3.3","hl":false,"def":"A pancreatic hormone that raises blood glucose by breaking glycogen down and making new glucose."},{"id":"diabetes","label":"Diabetes","theme":"D","code":"D3.3","hl":false,"def":"Type I destroys the insulin-producing beta cells; type II leaves receptors unresponsive. Both end in hyperglycaemia."},{"id":"thermoregulation","label":"Thermoregulation","theme":"D","code":"D3.3","hl":false,"def":"Holding body temperature at a set point. Thermoreceptors report to the hypothalamus, which triggers heating or cooling."},{"id":"vasodilation","label":"Vasodilation & vasoconstriction","theme":"D","code":"D3.3","hl":false,"def":"Widening skin arterioles sheds heat; narrowing them conserves it by shunting blood to the core."},{"id":"thyroxine","label":"Thyroxine & shivering","theme":"D","code":"D3.3","hl":false,"def":"Thyroxine raises metabolic rate across the body, and shivering contracts muscles - both generate heat as a by-product."},{"id":"osmoregulation","label":"Osmoregulation","theme":"D","code":"D3.3","hl":false,"def":"Controlling the water and solute concentration of body fluids, mainly through the kidney."}],"links":[{"s":"water","t":"hbond","r":"is polar, so it forms","k":"makes"},{"s":"hbond","t":"cohesion","r":"holds water to water, producing","k":"makes"},{"s":"hbond","t":"adhesion","r":"holds water to other surfaces, producing","k":"makes"},{"s":"hbond","t":"solvent","r":"surrounds ions and polar molecules, giving","k":"makes"},{"s":"hbond","t":"thermalprops","r":"must be broken before water heats up, giving it its","k":"makes"},{"s":"water","t":"hydrophobic","r":"sorts every other molecule into","k":"makes"},{"s":"asteroid","t":"water","r":"delivered Earth's","k":"makes"},{"s":"goldilocks","t":"water","r":"keeps a planet's","k":"needs"},{"s":"water","t":"originlife","r":"was the medium required for","k":"needs"},{"s":"hydrophobic","t":"membrane","r":"drives the self-assembly of the","k":"makes"},{"s":"hydrophobic","t":"tertiary","r":"pushes non-polar R groups inward during","k":"makes"},{"s":"solvent","t":"metabolicpathway","r":"provides the medium for every","k":"needs"},{"s":"solvent","t":"glucose","r":"dissolves and transports","k":"part"},{"s":"thermalprops","t":"thermoregulation","r":"makes sweat an effective coolant in","k":"part"},{"s":"cohesion","t":"transpiration","r":"keeps the water column unbroken during","k":"needs"},{"s":"adhesion","t":"xylem","r":"
